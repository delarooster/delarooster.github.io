  projects:
    details:
      - title: AI Delivery Skills and Story Loops
        color: gold
        link: https://github.com/delarooster/skills
        description: |
          Gave Claude Code, Codex, and OpenCode a shared playbook instead of explaining myself every morning.
          Fresh agents pick up stories, write tests, and open stacked PRs. A separate judge checks the receipts.
          Reusable skills, scored instruction sets, and explicit publication guardrails. Trust, but git diff.

      - title: Agent Workflow Experiments
        color: green
        link: https://github.com/delarooster/agent-workflows
        description: |
          C# agent workflow experiments, plus MCP and Semantic Kernel integrations for infrastructure work.
          Less "write me a poem about Kubernetes," more putting the tools to work.

      - title: Contractor Marketplace - Full-Stack Engineering
        color: orange
        description: |
          A mobile-first marketplace connecting contractors with workers. The interesting bits are under the hood.
          .NET API, SvelteKit, and PostgreSQL/Supabase, with shift calendars that respect the job site's time zone.
          Address and contact visibility tied to accepted work and explicit sharing rules, not just hidden buttons.
          Stripe prepaid balances and refund handling, including duplicate events and refunds arriving before credits.
          Because webhooks do not promise to arrive once, politely, in order.

      - title: Contractor Marketplace - Agentic Delivery
        color: gold
        description: |
          Put the story loop to work on a real application, not another to-do demo.
          Parallel agent teams use isolated worktrees and local test lanes; an independent PR judge checks the result.
          Self-hosted GitHub Actions runners and sharded Playwright suites handle the CI work.
          Agents also draft release notes and flag help text affected by code changes. The paperwork gets robots too.

      - title: Gear Saver
        color: green
        description: |
          Manifest V3 Chrome/Brave extension with content-script save buttons, instant listing search, and offline-first chrome.storage.local persistence.
          No backend or account required. Apparently my shopping habit needed tooling.

      - title: Azure Tag Cleanup
        color: blue
        link: https://github.com/delarooster/Azure.Tenant.Management.Tags
        description: |
          .NET and Azure Resource Manager SDK utility with YAML-driven tag migrations across subscriptions, resource groups, and resources.
          Parallel processing, value-preserving key renames, and collision checks. Cloud housekeeping, minus the portal clicking.

      - title: Terraform Module Testing
        color: pink
        link: https://github.com/delarooster/Terraform.Test.Demo
        description: |
          Native HCL terraform test runs assert Azure storage tier, replication, and tags at plan time, plus expected failures for invalid names.
          Because looking convincing in a code review is not a test.

      - title: Add Azure to AI Platform
        color: brown
        description: Gave an existing AI analysis platform an Azure option. The cloud menu needed another item.

      - title: AWS to Azure Migration
        color: red
        description: Lift 'n Shift of an entire AWS production environment to Azure. Same workloads, different someone else's computer.

      - title: Common IoT Ingress Platform
        color: gold
        description: Built a shared, extensible IoT ingress platform so every customer project did not start with the same plumbing homework.

      - title: IaC Module Library
        color: blue
        description: Turned repeat infrastructure into reusable modules. Copy-paste is not a versioning strategy.

