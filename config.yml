  misc:
    commandName: ai
    title: AI-Driven Delivery
    titleColor: gold
    contentColor: white
    content: |
      Automate all the things. Including the part where I used to babysit the automation.

      Story loops: pick a story, write the tests, do the work, open the PR. Fresh agent, no baggage.
      Independent review: a separate verifier and PR judge check the receipts. "Looks good" is not evidence.
      Cold starts: read state, do one job, write state, exit. No amnesia-induced architecture decisions.
      Instructions as code: versioned skills and scored evaluations. Even the prompts get a performance review.
      Human control: tests and explicit approval boundaries. The robots do not get the keys to everything.

      Tools: Claude Code, Codex, OpenCode, MCP, and Semantic Kernel.
      Explore the implementation: https://github.com/delarooster/skills
